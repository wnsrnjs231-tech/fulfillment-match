<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>3PL 견적 요청</title>
</head>
<body>

<h1>3PL 견적 요청</h1>

<form action="/requests"
      method="post"
      th:object="${requestDto}">

    <div>
        <label>상품 카테고리</label>
        <select name="productCategory">
            <option value="">선택해주세요</option>
            <option value="FASHION">패션</option>
            <option value="FOOD">식품</option>
            <option value="COSMETICS">화장품</option>
            <option value="LIVING">생활용품</option>
            <option value="ETC">기타</option>
        </select>

        <p th:if="${#fields.hasErrors('productCategory')}"
           th:errors="*{productCategory}">
        </p>

    </div>

    <div>
        <label>월 주문량</label>
        <input type="number" name="monthlyOrders">

        <p th:if="${#fields.hasErrors('monthlyOrders')}"
           th:errors="*{monthlyOrders}">
        </p>
    </div>

    <div>
        <label>SKU 수</label>
        <input type="number" name="skuCount">

        <p th:if="${#fields.hasErrors('skuCount')}"
           th:errors="*{skuCount}">
        </p>
    </div>

    <div>
        <label>희망 지역</label>
        <input type="text" name="desiredRegion">

        <p th:if="${#fields.hasErrors('desiredRegion')}"
           th:errors="*{desiredRegion}">
        </p>
    </div>

    <div>
        <label>
            <input type="checkbox" name="coldStorageRequired" value="true">
            냉장/냉동 필요
        </label>
    </div>

    <div>
        <label>
            <input type="checkbox" name="returnInspectionRequired" value="true">
            반품 검수 필요
        </label>
    </div>

    <div>
        <label>
            <input type="checkbox" name="specialPackingRequired" value="true">
            특수 포장 필요
        </label>
    </div>

    <div>
        <label>현재 물류 방식</label>
        <select name="currentLogisticsMethod">
            <option value="">선택해주세요</option>
            <option value="SELF_FULFILLMENT">직접 출고</option>
            <option value="THIRD_PARTY">기존 3PL 이용 중</option>
            <option value="MIXED">직접 출고 + 3PL 병행</option>
        </select>

        <p th:if="${#fields.hasErrors('currentLogisticsMethod')}"
           th:errors="*{currentLogisticsMethod}">
        </p>
    </div>

    <div>
        <label>추가 설명</label>
        <textarea name="description" rows="5" cols="40"></textarea>
    </div>

    <div>
        <button type="submit">요청 등록</button>
    </div>

</form>

</body>
</html>
