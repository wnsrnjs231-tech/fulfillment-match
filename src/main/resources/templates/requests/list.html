<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>요청 목록</title>
</head>
<body>

<h1>3PL 견적 요청 목록</h1>

<a href="/requests/new">새 요청 작성</a>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>번호</th>
        <th>카테고리</th>
        <th>월 주문량</th>
        <th>SKU 수</th>
        <th>희망 지역</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="request : ${requests}">
        <td>
            <a th:href="@{/requests/{id}(id=${request.id})}"
               th:text="${request.id}">
            </a>
        </td>

        <td th:text="${request.productCategory}"></td>
        <td th:text="${request.monthlyOrders}"></td>
        <td th:text="${request.skuCount}"></td>
        <td th:text="${request.desiredRegion}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
