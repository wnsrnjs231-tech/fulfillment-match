<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>요청 수정</title>
</head>
<body>

<h1>3PL 견적 요청 수정</h1>

<form th:action="@{/requests/{id}/edit(id=${shippingRequest.id})}"
      method="post"
      th:object="${shippingRequest}">

    <div>
        <label>상품 카테고리</label>
        <select th:field="*{productCategory}">
            <option value="">선택해주세요</option>
            <option value="FASHION">패션</option>
            <option value="FOOD">식품</option>
            <option value="COSMETICS">화장품</option>
            <option value="LIVING">생활용품</option>
            <option value="ETC">기타</option>
        </select>
    </div>

    <div>
        <label>월 주문량</label>
        <input type="number" th:field="*{monthlyOrders}">
    </div>

    <div>
        <label>SKU 수</label>
        <input type="number" th:field="*{skuCount}">
    </div>

    <div>
        <label>희망 지역</label>
        <input type="text" th:field="*{desiredRegion}">
    </div>

    <div>
        <label>현재 물류 방식</label>
        <select th:field="*{currentLogisticsMethod}">
            <option value="">선택해주세요</option>
            <option value="SELF_FULFILLMENT">직접 출고</option>
            <option value="THIRD_PARTY">기존 3PL 이용 중</option>
            <option value="MIXED">직접 출고 + 3PL 병행</option>
        </select>

        <p th:if="${#fields.hasErrors('currentLogisticsMethod')}"
           th:errors="*{currentLogisticsMethod}">
        </p>
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{coldStorageRequired}">
            냉장/냉동 필요
        </label>
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{returnInspectionRequired}">
            반품 검수 필요
        </label>
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{specialPackingRequired}">
            특수 포장 필요
        </label>
    </div>

    <div>
        <label>추가 설명</label>
        <textarea th:field="*{description}" rows="5" cols="40"></textarea>
    </div>

    <div>
        <button type="submit">수정 완료</button>
    </div>

</form>

</body>
</html>
