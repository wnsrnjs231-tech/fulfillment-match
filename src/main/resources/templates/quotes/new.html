<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>견적 등록</title>
</head>
<body>

<h1>견적 등록</h1>

<form action="/quotes"
      method="post"
      th:object="${quoteDto}">

    <div>
        <label>견적 요청 선택</label>

        <select th:field="*{shippingRequestId}">
            <option value="">선택해주세요</option>

            <option th:each="request : ${requests}"
                    th:value="${request.id}"
                    th:text="|요청 #${request.id} / ${request.productCategory} / 월 ${request.monthlyOrders}건|">
            </option>
        </select>

        <p th:if="${#fields.hasErrors('shippingRequestId')}"
           th:errors="*{shippingRequestId}">
        </p>
    </div>

    <div>
        <label>3PL 업체 선택</label>

        <select th:field="*{fulfillmentCompanyId}">
            <option value="">선택해주세요</option>

            <option th:each="company : ${companies}"
                    th:value="${company.id}"
                    th:text="${company.companyName}">
            </option>
        </select>

        <p th:if="${#fields.hasErrors('fulfillmentCompanyId')}"
           th:errors="*{fulfillmentCompanyId}">
        </p>
    </div>

    <div>
        <label>월 예상 비용</label>
        <input type="number" th:field="*{monthlyFee}">

        <p th:if="${#fields.hasErrors('monthlyFee')}"
           th:errors="*{monthlyFee}">
        </p>
    </div>

    <div>
        <label>초기 세팅 비용</label>
        <input type="number" th:field="*{setupFee}">

        <p th:if="${#fields.hasErrors('setupFee')}"
           th:errors="*{setupFee}">
        </p>
    </div>

    <div>
        <label>보관 비용</label>
        <input type="number" th:field="*{storageFee}">

        <p th:if="${#fields.hasErrors('storageFee')}"
           th:errors="*{storageFee}">
        </p>
    </div>

    <div>
        <label>출고 비용</label>
        <input type="number" th:field="*{shippingFee}">

        <p th:if="${#fields.hasErrors('shippingFee')}"
           th:errors="*{shippingFee}">
        </p>
    </div>

    <div>
        <label>제안 내용</label>
        <textarea th:field="*{message}"></textarea>
    </div>

    <div>
        <button type="submit">견적 제출</button>
    </div>

</form>

</body>
</html>
