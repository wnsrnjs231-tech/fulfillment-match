<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>3PL 업체 수정</title>
</head>
<body>

<h1>3PL 업체 수정</h1>

<form th:action="@{/companies/{id}/edit(id=${companyId})}"
      method="post"
      th:object="${updateDto}">

    <div>
        <label>업체명</label>
        <input type="text" th:field="*{companyName}">

        <p th:if="${#fields.hasErrors('companyName')}"
           th:errors="*{companyName}">
        </p>
    </div>

    <div>
        <label>사업자등록번호</label>
        <input type="text" th:field="*{businessNumber}">

        <p th:if="${#fields.hasErrors('businessNumber')}"
           th:errors="*{businessNumber}">
        </p>
    </div>

    <div>
        <label>담당자명</label>
        <input type="text" th:field="*{contactName}">

        <p th:if="${#fields.hasErrors('contactName')}"
           th:errors="*{contactName}">
        </p>
    </div>

    <div>
        <label>연락처</label>
        <input type="text" th:field="*{contactPhone}">

        <p th:if="${#fields.hasErrors('contactPhone')}"
           th:errors="*{contactPhone}">
        </p>
    </div>

    <div>
        <label>이메일</label>
        <input type="email" th:field="*{contactEmail}">

        <p th:if="${#fields.hasErrors('contactEmail')}"
           th:errors="*{contactEmail}">
        </p>
    </div>

    <div>
        <label>업체 주소</label>
        <input type="text" th:field="*{address}">

        <p th:if="${#fields.hasErrors('address')}"
           th:errors="*{address}">
        </p>
    </div>

    <div>
        <label>서비스 가능 지역</label>
        <input type="text" th:field="*{serviceRegion}">

        <p th:if="${#fields.hasErrors('serviceRegion')}"
           th:errors="*{serviceRegion}">
        </p>
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{coldStorageAvailable}">
            냉장/냉동 가능
        </label>
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{returnInspectionAvailable}">
            반품 검수 가능
        </label>
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{specialPackingAvailable}">
            특수 포장 가능
        </label>
    </div>

    <div>
        <button type="submit">수정 완료</button>
    </div>

</form>

<a th:href="@{/companies/{id}(id=${companyId})}">
    상세로 돌아가기
</a>

</body>
</html>
