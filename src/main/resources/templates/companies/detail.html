<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>3PL 업체 상세</title>
</head>
<body>

<h1>3PL 업체 상세</h1>

<p>
    업체명:
    <span th:text="${company.companyName}"></span>
</p>

<p>
    사업자등록번호:
    <span th:text="${company.businessNumber}"></span>
</p>

<p>
    담당자:
    <span th:text="${company.contactName}"></span>
</p>

<p>
    연락처:
    <span th:text="${company.contactPhone}"></span>
</p>

<p>
    이메일:
    <span th:text="${company.contactEmail}"></span>
</p>

<p>
    주소:
    <span th:text="${company.address}"></span>
</p>

<p>
    서비스 가능 지역:
    <span th:text="${company.serviceRegion}"></span>
</p>

<p>
    냉장/냉동:
    <span th:text="${company.coldStorageAvailable}"></span>
</p>

<p>
    반품 검수:
    <span th:text="${company.returnInspectionAvailable}"></span>
</p>

<p>
    특수 포장:
    <span th:text="${company.specialPackingAvailable}"></span>
</p>

<div>
    <a href="/companies">목록으로 돌아가기</a>
</div>

<div>
    <a th:href="@{/companies/{id}/edit(id=${company.id})}">
        업체 수정
    </a>
</div>

<div>
    <form th:action="@{/companies/{id}/delete(id=${company.id})}"
          method="post">
        <button type="submit">업체 삭제</button>
    </form>
</div>

</body>
</html>
